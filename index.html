<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合成世一师</title>
<meta name="description" content="把相同的小球合成更高等级，从「牢」一路合成到 ZT！">
<style>
  :root {
    color-scheme: dark;
    --bg: #10121d;
    --panel: #191d2e;
    --panel-2: #222742;
    --line: #394065;
    --text: #f4f6ff;
    --muted: #a8afce;
    --accent: #ffd166;
    --danger: #ff6b6b;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(circle at 20% 0%, #27304d 0%, var(--bg) 45%) no-repeat, var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(12px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom));
  }
  header {
    width: min(100%, 480px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  h1 {
    margin: 0;
    font-size: clamp(20px, 5vw, 27px);
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ffd166, #ef476f, #06d6a0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
  }
  .stats { display: flex; gap: 7px; }
  .score-box {
    min-width: 70px;
    padding: 6px 9px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #151929cc;
    text-align: center;
  }
  .score-box span { display: block; color: var(--muted); font-size: 10px; }
  .score-box strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  main {
    width: min(100%, 480px);
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 8px;
  }
  .side {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }
  .next {
    padding: 8px 6px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    text-align: center;
  }
  .next span { display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  .ball-preview {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 15px;
    margin: auto;
    box-shadow: inset -3px -5px 10px #0003;
  }
  button {
    border: 0;
    border-radius: 10px;
    padding: 9px 8px;
    color: #191f33;
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    background: var(--accent);
    width: 100%;
  }
  button:active { transform: translateY(1px); }
  .help {
    padding: 9px 7px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.6;
    text-align: left;
    background: #151929aa;
  }
  .stage-shell {
    position: relative;
    border: 2px solid var(--line);
    border-radius: 16px;
    background: linear-gradient(180deg, #171b2c, #121624);
    overflow: hidden;
    box-shadow: 0 18px 45px #0007;
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: pointer; }
  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    background: #0b0d16dd;
    backdrop-filter: blur(3px);
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 26px; }
  .overlay p { margin: -5px 0 0; color: var(--muted); }
  .overlay strong { color: var(--accent); }
  .chain {
    width: min(100%, 480px);
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 3px;
    color: var(--muted);
    font-size: 11px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .chain div {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #172033;
    font-weight: 900;
    font-size: 10px;
    box-shadow: inset -2px -3px 6px #0003;
  }
  .chain i { flex: 0 0 auto; font-style: normal; }
  footer { margin-top: 8px; color: #6f779b; font-size: 10px; text-align: center; }
  @media (max-width: 400px) {
    main { grid-template-columns: 1fr; }
    .side { flex-direction: row; align-items: stretch; }
    .next { flex: 1; }
    .help { display: none; }
    button { width: 100px; }
  }
</style>
</head>
<body>
<header>
  <h1>合成世一师</h1>
  <div class="stats" aria-label="分数与最高分">
    <div class="score-box"><span>分数</span><strong id="score">0</strong></div>
    <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
  </div>
</header>

<main>
  <aside class="side">
    <div class="next" aria-label="下一颗小球">
      <span>下一颗</span><div id="nextBall" class="ball-preview" aria-hidden="true"></div>
    </div>
    <button id="restart" type="button">重开</button>
    <div class="help">
      鼠标移动瞄准<br>点击 / 下键投放<br>← → 微调位置<br>相同球相碰合成
    </div>
  </aside>

  <div class="stage-shell">
    <canvas id="game" width="480" height="720" role="application" aria-label="合成世一师游戏区域"></canvas>
    <div id="overlay" class="overlay" hidden>
      <h2 id="overTitle">游戏结束</h2>
      <p>本局得分 <strong id="finalScore">0</strong></p>
      <button id="overlayRestart" type="button">再来一局</button>
    </div>
  </div>
</main>

<div class="chain" id="chain" aria-label="合成路线"></div>
<footer>两颗同级球合成下一级 · 世一师宇宙特别版</footer>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const nextEl = document.getElementById("nextBall");
  const overlay = document.getElementById("overlay");
  const finalScore = document.getElementById("finalScore");

  const W = 480, H = 720;
  const LEFT = 18, RIGHT = W - 18, FLOOR = H - 22;
  const DROP_Y = 74, DANGER_Y = 108;
  const TIERS = [
    { label: "牢", radius: 18, color: "#8ecae6", score: 1 },
    { label: "C",  radius: 25, color: "#90be6d", score: 3 },
    { label: "振", radius: 33, color: "#f9c74f", score: 6 },
    { label: "只", radius: 42, color: "#f8961e", score: 10 },
    { label: "米", radius: 52, color: "#ef476f", score: 16 },
    { label: "蛋", radius: 64, color: "#b5838d", score: 24 },
    { label: "AJYC", radius: 79, color: "#7b2cbf", score: 36 },
    { label: "ZT", radius: 95, color: "#00b4d8", score: 60 },
  ];

  const state = {
    balls: [],
    aimX: W / 2,
    current: randomTier(),
    next: randomTier(),
    score: 0,
    best: Number(localStorage.getItem("synthesis-world-coach-best") || 0),
    running: true,
    canDrop: true,
    dangerTime: 0,
    elapsed: 0,
    pops: []
  };

  function randomTier() { return Math.floor(Math.random() * 5); }

  function reset() {
    state.balls = [];
    state.pops = [];
    state.score = 0;
    state.current = randomTier();
    state.next = randomTier();
    state.running = true;
    state.canDrop = true;
    state.dangerTime = 0;
    state.elapsed = 0;
    overlay.hidden = true;
    syncHud();
  }

  function syncHud() {
    scoreEl.textContent = String(state.score);
    bestEl.textContent = String(state.best);
    const spec = TIERS[state.next];
    nextEl.textContent = spec.label;
    nextEl.style.background = spec.color;
    nextEl.style.color = readableColor(spec.color);
    nextEl.style.fontSize = spec.label.length > 2 ? "9px" : "";
  }

  function readableColor(color) {
    const n = parseInt(color.slice(1), 16);
    const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (0.299*r + 0.587*g + 0.114*b) > 165 ? "#172033" : "white";
  }

  function spawnBall(tier, x, y, age=0) {
    state.balls.push({
      tier, x, y, vx: 0, vy: 0,
      r: TIERS[tier].radius,
      born: state.elapsed,
      age
    });
  }

  function drop() {
    if (!state.running || !state.canDrop) return;
    const r = TIERS[state.current].radius;
    const x = Math.min(RIGHT-r, Math.max(LEFT+r, state.aimX));
    spawnBall(state.current, x, DROP_Y);
    state.current = state.next;
    state.next = randomTier();
    state.canDrop = false;
    setTimeout(() => {
      state.canDrop = true;
      if (state.running) canvas.dispatchEvent(new CustomEvent("game:ready"));
    }, 420);
    syncHud();
  }

  function physics(dt) {
    const g = 1450;
    const damping = Math.pow(0.21, dt);
    for (const b of state.balls) {
      b.vy += g*dt;
      b.vx *= damping;
      b.x += b.vx*dt;
      b.y += b.vy*dt;
      b.age += dt;
      if (b.x-b.r < LEFT) { b.x = LEFT+b.r; b.vx = Math.abs(b.vx)*0.24; }
      if (b.x+b.r > RIGHT) { b.x = RIGHT-b.r; b.vx = -Math.abs(b.vx)*0.24; }
      if (b.y+b.r > FLOOR) { b.y = FLOOR-b.r; b.vy = -Math.abs(b.vy)*0.12; b.vx *= 0.84; }
    }

    const merged = new Set();
    for (let i=0; i<state.balls.length; i++) {
      if (merged.has(i)) continue;
      for (let j=i+1; j<state.balls.length; j++) {
        if (merged.has(i) || merged.has(j)) continue;
        const a = state.balls[i], b = state.balls[j];
        const dx = b.x-a.x, dy = b.y-a.y;
        const dist = Math.hypot(dx,dy) || 0.001;
        const minDist = a.r+b.r;
        if (dist >= minDist) continue;

        if (a.tier === b.tier && a.tier < TIERS.length-1) {
          const spec = TIERS[a.tier+1];
          const massA = a.r*a.r, massB = b.r*b.r;
          const x = (a.x*massA+b.x*massB)/(massA+massB);
          const y = (a.y*massA+b.y*massB)/(massA+massB);
          state.balls = state.balls.filter((_, k) => k !== i && k !== j);
          state.score += TIERS[a.tier].score + spec.score;
          if (state.score > state.best) {
            state.best = state.score;
            localStorage.setItem("synthesis-world-coach-best", String(state.best));
          }
          state.pops.push({x, y, r: spec.radius, age: 0, text: spec.label});
          spawnBall(a.tier+1, x, Math.min(y, FLOOR-spec.radius), 0.12);
          syncHud();
          return physics(dt);
        }

        const nx=dx/dist, ny=dy/dist;
        const overlap=minDist-dist;
        const ma=a.r*a.r, mb=b.r*b.r, total=ma+mb;
        a.x -= nx*overlap*(mb/total)*0.55;
        a.y -= ny*overlap*(mb/total)*0.55;
        b.x += nx*overlap*(ma/total)*0.55;
        b.y += ny*overlap*(ma/total)*0.55;
        const rvx=b.vx-a.vx, rvy=b.vy-a.vy;
        const sep=rvx*nx+rvy*ny;
        if (sep < 0) {
          const e=0.18;
          const jimp=-(1+e)*sep/(1/ma+1/mb);
          a.vx -= jimp*nx/ma; a.vy -= jimp*ny/ma;
          b.vx += jimp*nx/mb; b.vy += jimp*ny/mb;
          a.vx *= 0.995; b.vx *= 0.995;
        }
      }
    }
  }

  function updateDanger(dt) {
    const unsafe = state.balls.some(b => b.age > 0.65 && b.y-b.r < DANGER_Y && Math.abs(b.vy) < 210);
    state.dangerTime = unsafe ? state.dangerTime+dt : Math.max(0, state.dangerTime-dt*1.5);
    if (state.dangerTime > 2) {
      state.running = false;
      finalScore.textContent = String(state.score);
      overlay.hidden = false;
    }
  }

  function updatePops(dt) {
    for (const p of state.pops) p.age += dt;
    state.pops = state.pops.filter(p => p.age < 0.48);
  }

  function drawGuide() {
    const spec=TIERS[state.current], r=spec.radius;
    const x=Math.min(RIGHT-r, Math.max(LEFT+r,state.aimX));
    ctx.save();
    ctx.setLineDash([6,7]);
    ctx.strokeStyle="rgba(255,255,255,.30)";
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x,DROP_Y+r+6); ctx.lineTo(x,FLOOR); ctx.stroke();
    ctx.globalAlpha=.92;
    drawBallShape(x,DROP_Y,r,spec.color,spec.label,1);
    ctx.restore();
  }

  function drawBallShape(x,y,r,color,label,alpha=1) {
    ctx.save();
    ctx.globalAlpha=alpha;
    const grad=ctx.createRadialGradient(x-r*.38,y-r*.45,r*.12,x,y,r);
    grad.addColorStop(0,"rgba(255,255,255,.72)");
    grad.addColorStop(.22,color);
    grad.addColorStop(1,"rgba(0,0,0,.28)");
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=grad; ctx.fill();
    ctx.lineWidth=Math.max(2,r*.055);
    ctx.strokeStyle="rgba(255,255,255,.32)"; ctx.stroke();
    ctx.shadowColor="rgba(0,0,0,.35)"; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
    ctx.fillStyle=readableColor(color);
    ctx.font=`900 ${Math.max(11,r*(label.length>3?.30:.58))}px system-ui, sans-serif`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(label,x,y+r*.03);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#202641"); bg.addColorStop(1,"#141726");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    ctx.strokeStyle="#394065"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(LEFT,FLOOR+8); ctx.lineTo(LEFT,DANGER_Y-18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(RIGHT,FLOOR+8); ctx.lineTo(RIGHT,DANGER_Y-18); ctx.stroke();

    ctx.strokeStyle="rgba(255,107,107,.62)";
    ctx.setLineDash([9,9]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(LEFT,DANGER_Y); ctx.lineTo(RIGHT,DANGER_Y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="rgba(255,107,107,.72)";
    ctx.font="700 11px system-ui,sans-serif";
    ctx.fillText("危险线",LEFT+5,DANGER_Y-7);

    if (state.running && state.canDrop) drawGuide();
    for (const b of state.balls) drawBallShape(b.x,b.y,b.r,TIERS[b.tier].color,TIERS[b.tier].label);

    for (const p of state.pops) {
      const t=p.age/.48;
      ctx.save();
      ctx.globalAlpha=1-t;
      ctx.strokeStyle="#fff";
      ctx.lineWidth=4*(1-t)+1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(.6+t*.7),0,Math.PI*2); ctx.stroke();
      ctx.fillStyle="#fff";
      ctx.font="800 16px system-ui,sans-serif"; ctx.textAlign="center";
      ctx.fillText(p.text,p.x,p.y-p.r*(.7+t*.6));
      ctx.restore();
    }
  }

  let last=performance.now();
  function frame(now) {
    const dt=Math.min(.033,(now-last)/1000); last=now;
    if (state.running) {
      state.elapsed += dt;
      physics(dt);
      updateDanger(dt);
      updatePops(dt);
    }
    draw();
    requestAnimationFrame(frame);
  }

  function pointerX(event) {
    const rect=canvas.getBoundingClientRect();
    return (event.clientX-rect.left)*(W/rect.width);
  }
  canvas.addEventListener("pointermove", event => {
    state.aimX=pointerX(event);
    event.preventDefault();
  }, {passive:false});
  canvas.addEventListener("pointerdown", event => {
    state.aimX=pointerX(event);
    drop();
    event.preventDefault();
  }, {passive:false});
  window.addEventListener("keydown", event => {
    if (!state.running) return;
    if (event.key === "ArrowLeft") { state.aimX -= 20; event.preventDefault(); }
    if (event.key === "ArrowRight") { state.aimX += 20; event.preventDefault(); }
    if (event.key === "ArrowDown" || event.key === " ") { drop(); event.preventDefault(); }
  });
  document.getElementById("restart").addEventListener("click", reset);
  document.getElementById("overlayRestart").addEventListener("click", reset);

  const chain=document.getElementById("chain");
  TIERS.forEach((tier,index) => {
    if (index) chain.appendChild(document.createTextNode("→"));
    const item=document.createElement("div");
    item.textContent=tier.label;
    item.style.background=tier.color;
    item.style.color=readableColor(tier.color);
    chain.appendChild(item);
  });

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

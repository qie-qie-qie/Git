<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合成世一班</title>
<meta name="description" content="把相同的小球合成更高等级，从「牢」一路合成到 2班！">
<style>
  :root {
    color-scheme: dark;
    --bg: #111632;
    --panel: #1c2450;
    --panel-deep: #151b3f;
    --line: #5560a8;
    --text: #ffffff;
    --muted: #c9d1ff;
    --accent: #ffd166;
    --accent-ink: #251c00;
    --danger: #ff5f7a;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100dvh;
    padding: max(6px, env(safe-area-inset-top)) 6px max(8px, env(safe-area-inset-bottom));
  }
  header {
    width: min(100%, 520px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 5px;
  }
  h1 {
    margin: 0;
    font-size: clamp(18px, 4.6vw, 24px);
    font-weight: 900;
    letter-spacing: 1px;
    color: #ffd166;
    white-space: nowrap;
  }
  .stats { display: flex; gap: 7px; }
  .score-box {
    min-width: 62px;
    padding: 4px 7px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: var(--panel-deep);
    text-align: center;
  }
  .score-box span { display: block; color: var(--muted); font-size: 10px; }
  .score-box strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  main {
    width: min(100%, 520px);
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
    min-height: 0;
  }
  .side {
    display: grid;
    grid-template-columns: minmax(100px, auto) repeat(3, minmax(54px, auto));
    justify-content: center;
    align-items: center;
    gap: 6px;
  }
  .next {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 4px 7px;
    border: 2px solid var(--line);
    border-radius: 11px;
    background: var(--panel);
    text-align: center;
  }
  .next span { display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  .ball-preview {
    width: 34px;
    height: 34px;
    border: 3px solid #1e2350;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 15px;
    margin: auto;
  }
  .stage-shell {
    position: relative;
    width: min(100%, calc((100dvh - 108px) * 2 / 3), 520px);
    aspect-ratio: 2 / 3;
    margin: 0 auto;
    border: 4px solid #1e2350;
    border-radius: 14px;
    background: #fffdf4;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 13px;
    text-align: center;
    padding: 20px;
    background: #fffdf4ee;
    color: #1e2350;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 26px; color: #e5397a; }
  .overlay p { margin: -5px 0 0; color: #48518a; }
  .overlay strong { color: #d81159; }
  footer { margin-top: 3px; color: #9aa4e0; font-size: 9px; text-align: center; }

  .account-overlay, .board-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    padding: 14px;
    background: #0b0f22e8;
  }
  .account-overlay[hidden], .board-overlay[hidden] { display: none; }
  .account-card, .board-card {
    width: min(94vw, 390px);
    max-height: min(86dvh, 620px);
    overflow: auto;
    padding: 16px;
    border: 4px solid #1e2350;
    border-radius: 16px;
    background: #fffdf4;
    color: #1e2350;
    box-shadow: 0 12px 0 #101632;
  }
  .account-card form, .board-card div { display: grid; gap: 9px; }
  .account-card h2, .board-card h2 { margin: 0; font-size: 23px; color: #d81159; }
  .account-card label, .board-card p { margin: 0; color: #48518a; font-size: 12px; }
  .account-card input {
    width: 100%;
    padding: 10px;
    border: 3px solid #1e2350;
    border-radius: 10px;
    font: 800 16px inherit;
    color: #1e2350;
    background: white;
  }
  .account-card input:focus, button:focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }
  .account-note { min-height: 17px; color: #d81159; font-size: 12px; font-weight: 800; }
  .board-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .board-list li {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 7px;
    align-items: center;
    padding: 6px 7px;
    border: 2px solid #d9d5ef;
    border-radius: 8px;
    background: white;
    font-size: 12px;
    font-weight: 800;
  }
  .board-list li.me { border-color: #d81159; background: #fff0f5; color: #d81159; }
  .board-list .rank { color: #48518a; font-variant-numeric: tabular-nums; }
  .board-list .score { font-variant-numeric: tabular-nums; }
  .board-status { min-height: 16px; color: #48518a; font-size: 11px; }
  .secondary-button { background: #e9e5ff; color: #1e2350; }

</style>
</head>
<body>
<header>
  <h1>合成世一班</h1>
  <div class="stats" aria-label="分数与最高分">
    <div class="score-box"><span>分数</span><strong id="score">0</strong></div>
    <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
  </div>
</header>

<main>
  <aside class="side">
    <div class="next" aria-label="下一颗小球">
      <span>下一颗</span><div id="nextBall" class="ball-preview" aria-hidden="true"></div>
    </div>
    <button id="leaderboard" type="button">排行</button>
    <button id="restart" type="button">重开</button>
    <button id="logout" type="button" class="secondary-button">退出</button>
  </aside>

  <div class="stage-shell">
    <canvas id="game" width="480" height="720" role="application" aria-label="合成世一班游戏区域"></canvas>
    <div id="overlay" class="overlay" hidden>
      <h2 id="overTitle">游戏结束</h2>
      <p>本局得分 <strong id="finalScore">0</strong></p>
      <button id="overlayRestart" type="button">再来一局</button>
    </div>
  </div>
</main>

<footer>两颗同级球合成下一级 · 世一班宇宙特别版</footer>

<div id="loginOverlay" class="account-overlay" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <section class="account-card">
    <form id="loginForm">
      <h2 id="loginTitle">账号登录</h2>
      <label for="usernameInput">请输入老师预先设置的账号名</label>
      <input id="usernameInput" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" required>
      <button id="loginButton" type="submit">登录游戏</button>
      <div id="loginMessage" class="account-note" role="status" aria-live="polite"></div>
    </form>
  </section>
</div>

<div id="boardOverlay" class="board-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="boardTitle">
  <section class="board-card">
    <div>
      <h2 id="boardTitle">积分排行榜</h2>
      <div id="boardStatus" class="board-status" role="status" aria-live="polite">加载中…</div>
      <ol id="boardList" class="board-list"></ol>
      <button id="boardClose" type="button" class="secondary-button">关闭</button>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const nextEl = document.getElementById("nextBall");
  const overlay = document.getElementById("overlay");
  const finalScore = document.getElementById("finalScore");
  const loginOverlay = document.getElementById("loginOverlay");
  const loginForm = document.getElementById("loginForm");
  const usernameInput = document.getElementById("usernameInput");
  const loginButton = document.getElementById("loginButton");
  const loginMessage = document.getElementById("loginMessage");
  const boardOverlay = document.getElementById("boardOverlay");
  const boardStatus = document.getElementById("boardStatus");
  const boardList = document.getElementById("boardList");
  const boardClose = document.getElementById("boardClose");
  const leaderboardButton = document.getElementById("leaderboard");
  const logoutButton = document.getElementById("logout");
  const SUPABASE_URL = "https://qvvocizlcsfufmjclngq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_udDHJ6wePMfSM7GwoqNTYA_A4GrBsMz";
  const SESSION_STORAGE_KEY = "synthesis-world-class-session-v1";
  const tierImages = {
    AJYC: Object.assign(new Image(), { src: "assets/AJYC.png" }),
    ZT: Object.assign(new Image(), { src: "assets/ZT.png" }),
    "2班": Object.assign(new Image(), { src: "assets/2班.png" }),
  };

  const W = 480, H = 720;
  const LEFT = 18, RIGHT = W - 18, FLOOR = H - 22;
  const DROP_Y = 74, DANGER_Y = 108;
  // Only the first four tiers spawn; smaller balls are intentionally more common.
  const DROP_POOL = [
    { tier: 0, weight: 46 },
    { tier: 1, weight: 31 },
    { tier: 2, weight: 16 },
    { tier: 3, weight: 7 },
  ];
  const TIERS = [
    { label: "牢", radius: 18, color: "#8ecae6", score: 1 },
    { label: "C",  radius: 25, color: "#90be6d", score: 3 },
    { label: "振", radius: 33, color: "#f9c74f", score: 6 },
    { label: "只", radius: 42, color: "#f8961e", score: 10 },
    { label: "米", radius: 52, color: "#ef476f", score: 16 },
    { label: "蛋", radius: 64, color: "#b5838d", score: 24 },
    { label: "AJYC", radius: 79, color: "#7b2cbf", score: 36 },
    { label: "ZT", radius: 95, color: "#00b4d8", score: 60 },
    { label: "2班", radius: 112, color: "#ffb703", score: 100 },
  ];

  const state = {
    balls: [],
    aimX: W / 2,
    current: randomTier(),
    next: randomTier(),
    score: 0,
    best: 0,
    running: false,
    loggedIn: false,
    sessionToken: null,
    username: null,
    scoreSubmitted: false,
    canDrop: true,
    dangerTime: 0,
    elapsed: 0,
    pops: [],
    messages: [],
    fireworks: []
  };

  function configureCanvasQuality() {
    const scale = 2; // Always use the detailed high-resolution renderer.
    canvas.width = W * scale;
    canvas.height = H * scale;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  }

  function randomTier() {
    const total = DROP_POOL.reduce((sum, item) => sum + item.weight, 0);
    let roll = Math.random() * total;
    for (const item of DROP_POOL) {
      roll -= item.weight;
      if (roll < 0) return item.tier;
    }
    return DROP_POOL[DROP_POOL.length - 1].tier;
  }

  function reset() {
    state.balls = [];
    state.pops = [];
    state.messages = [];
    state.fireworks = [];
    state.score = 0;
    state.current = randomTier();
    state.next = randomTier();
    state.running = true;
    state.canDrop = true;
    state.dangerTime = 0;
    state.elapsed = 0;
    state.scoreSubmitted = false;
    overlay.hidden = true;
    syncHud();
    configureCanvasQuality();
  }

  function syncHud() {
    scoreEl.textContent = String(state.score);
    bestEl.textContent = String(state.best);
    const spec = TIERS[state.next];
    nextEl.textContent = spec.label;
    nextEl.style.background = spec.color;
    nextEl.style.color = readableColor(spec.color);
    nextEl.style.fontSize = spec.label.length > 2 ? "9px" : "";
  }

  function readableColor(color) {
    const n = parseInt(color.slice(1), 16);
    const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (0.299*r + 0.587*g + 0.114*b) > 165 ? "#172033" : "white";
  }

  function spawnBall(tier, x, y, age=0) {
    state.balls.push({
      tier, x, y, vx: 0, vy: 0,
      r: TIERS[tier].radius,
      born: state.elapsed,
      age
    });
  }

  function drop() {
    if (!state.running || !state.loggedIn || !state.canDrop) return;
    const r = TIERS[state.current].radius;
    const x = Math.min(RIGHT-r, Math.max(LEFT+r, state.aimX));
    spawnBall(state.current, x, DROP_Y);
    state.current = state.next;
    state.next = randomTier();
    state.canDrop = false;
    setTimeout(() => {
      state.canDrop = true;
      if (state.running) canvas.dispatchEvent(new CustomEvent("game:ready"));
    }, 330);
    syncHud();
  }

  function clampBallToWorld(ball) {
    ball.x = Math.min(RIGHT-ball.r, Math.max(LEFT+ball.r, ball.x));
    ball.y = Math.min(FLOOR-ball.r, ball.y);
  }

  function mergeBalls(a, b, indexA, indexB) {
    const spec = TIERS[a.tier + 1];
    // Three-dimensional spherical mass is proportional to radius cubed.
    const massA = a.r*a.r*a.r, massB = b.r*b.r*b.r;
    const x = (a.x*massA+b.x*massB)/(massA+massB);
    const y = (a.y*massA+b.y*massB)/(massA+massB);
    state.balls = state.balls.filter((_, index) => index !== indexA && index !== indexB);
    state.score += TIERS[a.tier].score + spec.score;
    if (state.score > state.best) state.best = state.score;
    state.pops.push({x, y, r: spec.radius, tier: a.tier + 1, age: 0, text: spec.label});
    const spawned = {
      tier: a.tier + 1, x, y, vx: 0, vy: 0,
      r: spec.radius, born: state.elapsed, age: 0.12
    };
    state.balls.push(spawned);
    clampBallToWorld(spawned);
    startCelebration(a.tier + 1, x, y);
    syncHud();
  }

  function physics(dt) {
    const g = 1650;
    const damping = Math.pow(0.21, dt);
    for (const ball of state.balls) {
      ball.vy += g*dt;
      ball.vx *= damping;
      ball.x += ball.vx*dt;
      ball.y += ball.vy*dt;
      ball.age += dt;
      clampBallToWorld(ball);
      if (ball.x-ball.r <= LEFT) ball.vx = Math.abs(ball.vx)*0.16;
      if (ball.x+ball.r >= RIGHT) ball.vx = -Math.abs(ball.vx)*0.16;
      if (ball.y+ball.r >= FLOOR) {
        ball.vy = -Math.abs(ball.vy)*0.06;
        ball.vx *= 0.98;
      }
    }

    // Gradual relaxation resolves dense stacks without the jitter caused by
    // applying a full positional correction every frame.
    for (let pass=0; pass<6; pass++) {
      let collided = false;
      let mergedThisPass = false;

      pairLoop:
      for (let i=0; i<state.balls.length; i++) {
        for (let j=i+1; j<state.balls.length; j++) {
          const a=state.balls[i], b=state.balls[j];
          const dx=b.x-a.x, dy=b.y-a.y;
          const distance=Math.hypot(dx,dy) || 0.001;
          const minimumDistance=a.r+b.r;
          if (distance >= minimumDistance) continue;

          collided = true;
          if (a.tier === b.tier && a.tier < TIERS.length-1) {
            mergeBalls(a, b, i, j);
            mergedThisPass = true;
            break pairLoop;
          }

          const nx=dx/distance, ny=dy/distance;
          const ma=a.r*a.r*a.r, mb=b.r*b.r*b.r;
          const inverseA=1/ma, inverseB=1/mb;
          const separationWeight=inverseA/(inverseA+inverseB);
          const correction=(minimumDistance-distance)*0.82;
          a.x -= nx*correction*separationWeight;
          a.y -= ny*correction*separationWeight;
          b.x += nx*correction*(1-separationWeight);
          b.y += ny*correction*(1-separationWeight);

          const rvx=b.vx-a.vx, rvy=b.vy-a.vy;
          const separationVelocity=rvx*nx+rvy*ny;
          if (separationVelocity < 0) {
            // Equal-and-opposite impulse with 3-D spherical masses.
            // Low-speed contacts use zero restitution to suppress micro-shaking.
            const restitution=separationVelocity < -45 ? 0.38 : 0;
            const impulse=-(1+restitution)*separationVelocity/(inverseA+inverseB);
            a.vx -= impulse*nx*inverseA;
            a.vy -= impulse*ny*inverseA;
            b.vx += impulse*nx*inverseB;
            b.vy += impulse*ny*inverseB;
          }
        }
      }

      for (const ball of state.balls) {
        clampBallToWorld(ball);
        if (Math.abs(ball.vx) < 5) ball.vx=0;
        if (Math.abs(ball.vy) < 18) ball.vy=0;
      }
      if (!collided && !mergedThisPass) break;
    }
  }

  async function supabaseRpc(functionName, payload) {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      },
      body: JSON.stringify(payload)
    });
    const text = await response.text();
    const data = text ? JSON.parse(text) : null;
    if (!response.ok) {
      const message = data?.message || data?.error || "请求失败，请稍后再试";
      throw new Error(message);
    }
    return data;
  }

  function showLogin(message="") {
    state.loggedIn = false;
    state.running = false;
    state.sessionToken = null;
    state.username = null;
    state.best = 0;
    state.balls = [];
    state.pops = [];
    state.messages = [];
    state.fireworks = [];
    state.score = 0;
    state.dangerTime = 0;
    loginMessage.textContent = message;
    loginOverlay.hidden = false;
    boardOverlay.hidden = true;
    overlay.hidden = true;
    syncHud();
    usernameInput.focus();
  }

  async function handleLogin(event) {
    event.preventDefault();
    const username = usernameInput.value.trim().toLowerCase();
    loginMessage.textContent = "";
    if (!username) {
      loginMessage.textContent = "请输入账号名";
      return;
    }
    loginButton.disabled = true;
    loginButton.textContent = "登录中…";
    try {
      const token = await supabaseRpc("game_login", { p_username: username });
      state.sessionToken = token;
      localStorage.setItem(SESSION_STORAGE_KEY, token);
      const session = await supabaseRpc("game_session", { p_token: token });
      applySession(session);
      loginOverlay.hidden = true;
      reset();
    } catch (error) {
      localStorage.removeItem(SESSION_STORAGE_KEY);
      loginMessage.textContent = error.message === "account not allowed"
        ? "这个账号名不在允许列表中"
        : (error.message || "登录失败，请稍后再试");
    } finally {
      loginButton.disabled = false;
      loginButton.textContent = "登录游戏";
    }
  }

  function applySession(session) {
    if (!session) throw new Error("session expired");
    state.loggedIn = true;
    state.username = session.username;
    state.best = Number(session.bestScore || 0);
    state.sessionToken = localStorage.getItem(SESSION_STORAGE_KEY);
    syncHud();
  }

  async function restoreSession() {
    const token = localStorage.getItem(SESSION_STORAGE_KEY);
    if (!token) {
      showLogin();
      return;
    }
    try {
      const session = await supabaseRpc("game_session", { p_token: token });
      applySession(session);
      reset();
    } catch {
      localStorage.removeItem(SESSION_STORAGE_KEY);
      showLogin("登录已过期，请重新输入账号名");
    }
  }

  async function submitCurrentScore() {
    if (!state.sessionToken) return;
    try {
      const result = await supabaseRpc("game_submit_score", {
        p_token: state.sessionToken,
        p_score: state.score
      });
      state.best = Number(result.bestScore || state.best);
      syncHud();
    } catch {
      state.scoreSubmitted = false;
    }
  }

  function renderLeaderboard(entries) {
    boardList.replaceChildren();
    for (const entry of entries) {
      const item=document.createElement("li");
      if (entry.username === state.username) item.className="me";
      const rank=document.createElement("span");
      rank.className="rank"; rank.textContent=`#${entry.rank}`;
      const name=document.createElement("span");
      name.textContent=entry.username;
      const score=document.createElement("span");
      score.className="score"; score.textContent=String(entry.bestScore);
      item.append(rank,name,score);
      boardList.appendChild(item);
    }
  }

  async function showLeaderboard() {
    boardOverlay.hidden = false;
    boardStatus.textContent = "加载中…";
    boardList.replaceChildren();
    try {
      const entries = await supabaseRpc("game_leaderboard", {});
      renderLeaderboard(entries);
      boardStatus.textContent = `共 ${entries.length} 个账号`;
    } catch (error) {
      boardStatus.textContent = error.message || "排行榜加载失败";
    }
  }

  async function handleLogout() {
    if (!state.sessionToken) {
      showLogin();
      return;
    }
    try { await supabaseRpc("game_logout", { p_token: state.sessionToken }); }
    catch { /* Logout locally even if the network request fails. */ }
    localStorage.removeItem(SESSION_STORAGE_KEY);
    usernameInput.value = "";
    showLogin();
  }

  function startCelebration(tier, x, y) {
    if (tier === 7) {
      showMessage("母校建校20周年快乐", 4);
      launchFireworks(x, y);
    } else if (tier === 8) {
      showMessage("永远的高2023级2班", 5);
    }
  }

  function showMessage(text, duration) {
    const existing = state.messages.find(message => message.text === text);
    if (existing) {
      existing.age = 0;
      existing.duration = duration;
      return;
    }
    state.messages.push({ text, duration, age: 0 });
  }

  function launchFireworks(originX, originY) {
    const burstCount = 6;
    const centers = [
      {x: originX, y: originY},
      {x: W*.25, y: H*.25},
      {x: W*.75, y: H*.24},
      {x: W*.50, y: H*.18},
      {x: W*.18, y: H*.38},
      {x: W*.82, y: H*.36},
    ].slice(0, burstCount);
    const colors = ["#ff477e", "#ffd166", "#06d6a0", "#4cc9f0", "#b5179e"];

    centers.forEach((center, burstIndex) => {
      const particleCount = 30;
      const delay = burstIndex * 0.18;
      for (let i=0; i<particleCount; i++) {
        const angle=(i/particleCount)*Math.PI*2 + Math.random()*.18;
        const speed=85+Math.random()*145;
        state.fireworks.push({
          x: center.x, y: center.y,
          vx: Math.cos(angle)*speed,
          vy: Math.sin(angle)*speed,
          age: -delay,
          life: 0.85+Math.random()*.45,
          color: colors[(burstIndex+i)%colors.length]
        });
      }
    });
  }

  function updateCelebrations(dt) {
    for (const message of state.messages) message.age += dt;
    state.messages = state.messages.filter(message => message.age < message.duration);

    for (const particle of state.fireworks) {
      particle.age += dt;
      if (particle.age <= 0) continue;
      particle.x += particle.vx*dt;
      particle.y += particle.vy*dt;
      particle.vy += 185*dt;
      particle.vx *= Math.pow(.50, dt);
    }
    state.fireworks = state.fireworks.filter(particle => particle.age < particle.life);
  }

  function drawCelebrations() {
    for (const particle of state.fireworks) {
      if (particle.age <= 0) continue;
      const lifeRatio=particle.age/particle.life;
      const alpha=Math.max(0, 1-lifeRatio);
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.strokeStyle=particle.color;
      ctx.lineWidth=3;
      ctx.lineCap="round";
      ctx.beginPath();
      ctx.moveTo(particle.x-particle.vx*.035, particle.y-particle.vy*.035);
      ctx.lineTo(particle.x, particle.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(particle.x,particle.y,2.4,0,Math.PI*2);
      ctx.fillStyle=particle.color;
      ctx.fill();
      ctx.restore();
    }

    for (const message of state.messages) {
      const fadeIn=Math.min(1,message.age/.22);
      const fadeOut=Math.min(1,Math.max(0,(message.duration-message.age)/.55));
      const alpha=Math.min(fadeIn,fadeOut);
      let fontSize=34;
      ctx.font=`900 ${fontSize}px system-ui,sans-serif`;
      while (ctx.measureText(message.text).width > W-70 && fontSize>20) {
        fontSize--;
        ctx.font=`900 ${fontSize}px system-ui,sans-serif`;
      }
      const width=ctx.measureText(message.text).width+34;
      const height=62;
      const x=(W-width)/2;
      const y=160;

      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.fillStyle="#fffdf4";
      ctx.strokeStyle="#1e2350";
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x,y,width,height,14) : ctx.rect(x,y,width,height);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle="#d81159";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillText(message.text,W/2,y+height/2+1);
      ctx.restore();
    }
  }

  function updateDanger(dt) {
    // A ball must stay clearly above the line and be genuinely settled before
    // the run ends. This avoids deaths from transient bounces or merges.
    const unsafe = state.balls.some(b =>
      b.age > 1 &&
      b.y-b.r < DANGER_Y-8 &&
      Math.abs(b.vx) < 60 &&
      Math.abs(b.vy) < 80
    );
    state.dangerTime = unsafe ? state.dangerTime+dt : Math.max(0, state.dangerTime-dt*2);
    if (state.dangerTime > 2.4) {
      state.running = false;
      finalScore.textContent = String(state.score);
      overlay.hidden = false;
      if (!state.scoreSubmitted) {
        state.scoreSubmitted = true;
        submitCurrentScore();
      }
    }
  }

  function updatePops(dt) {
    for (const p of state.pops) p.age += dt;
    state.pops = state.pops.filter(p => p.age < (p.tier >= 5 ? 0.72 : 0.48));
  }

  function drawGuide() {
    const spec=TIERS[state.current], r=spec.radius;
    const x=Math.min(RIGHT-r, Math.max(LEFT+r,state.aimX));
    ctx.save();
    ctx.setLineDash([6,7]);
    ctx.strokeStyle="rgba(255,255,255,.30)";
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x,DROP_Y+r+6); ctx.lineTo(x,FLOOR); ctx.stroke();
    ctx.globalAlpha=.92;
    drawBallShape(x,DROP_Y,r,spec.color,spec.label,1);
    ctx.restore();
  }

  function drawBallShape(x,y,r,color,label,alpha=1) {
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
    ctx.lineWidth=Math.max(2.5,r*.075);
    ctx.strokeStyle="#1e2350";
    ctx.stroke();

    // Flat anime-style cheek accents; no specular highlight or 3-D reflection.
    const tierImage = tierImages[label];
    if (tierImage && tierImage.complete && tierImage.naturalWidth) {
      // Keep custom badges fully flat: circular clipping only, no lighting or reflection.
      const iconR=r*.76;
      ctx.save();
      ctx.beginPath(); ctx.arc(x,y,iconR,0,Math.PI*2); ctx.clip();
      ctx.drawImage(tierImage,x-iconR,y-iconR,iconR*2,iconR*2);
      ctx.restore();
      ctx.beginPath(); ctx.arc(x,y,iconR,0,Math.PI*2);
      ctx.lineWidth=Math.max(2,r*.045);
      ctx.strokeStyle="#ffffff"; ctx.stroke();
      ctx.lineWidth=1;
      ctx.strokeStyle="#1e2350"; ctx.stroke();
      ctx.restore();
      return;
    }

    if (r >= 25) {
      ctx.beginPath(); ctx.ellipse(x-r*.42,y+r*.12,r*.08,r*.05,0,0,Math.PI*2);
      ctx.ellipse(x+r*.42,y+r*.12,r*.08,r*.05,0,0,Math.PI*2);
      ctx.fillStyle="rgba(255,94,141,.55)"; ctx.fill();
    }

    ctx.fillStyle=readableColor(color);
    ctx.font=`900 ${Math.max(11,r*(label.length>3?.30:.55))}px system-ui, sans-serif`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.lineWidth=Math.max(2,r*.035);
    ctx.strokeStyle="rgba(30,35,80,.28)";
    ctx.strokeText(label,x,y+r*.03);
    ctx.fillText(label,x,y+r*.03);
    ctx.restore();
  }

  function drawSynthesisPop(p) {
    const large = p.tier >= 5;
    const duration = large ? .72 : .48;
    const t = Math.min(1, p.age/duration);
    const fade = 1-t;
    ctx.save();
    ctx.globalAlpha=fade;
    ctx.textAlign="center";
    ctx.lineCap="round";

    // Main burst.
    ctx.strokeStyle="#d81159";
    ctx.lineWidth=(large ? 8 : 5)*fade+1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(.55+t*(large ? 1.15 : .70)),0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle="#1e2350";
    ctx.lineWidth=1;
    ctx.stroke();

    if (large) {
      // Larger balls receive a stronger two-dimensional anime burst.
      ctx.strokeStyle="#ffb703";
      ctx.lineWidth=5*fade+1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(.35+t*.82),0,Math.PI*2); ctx.stroke();

      {
        const rays = p.tier >= 7 ? 12 : 8;
        const inner = p.r*(.72+t*.32);
        const outer = p.r*(1.05+t*.55);
        ctx.strokeStyle="#1e2350";
        ctx.lineWidth=4*fade+1;
        for (let i=0; i<rays; i++) {
          const angle=(i/rays)*Math.PI*2 + t*.65;
          ctx.beginPath();
          ctx.moveTo(p.x+Math.cos(angle)*inner,p.y+Math.sin(angle)*inner);
          ctx.lineTo(p.x+Math.cos(angle)*outer,p.y+Math.sin(angle)*outer);
          ctx.stroke();
        }
      }
    }

    ctx.fillStyle=large ? "#d81159" : "#1e2350";
    ctx.font=`900 ${large ? 24 : 16}px system-ui,sans-serif`;
    ctx.fillText(p.text,p.x,p.y-p.r*(.72+t*(large ? .82 : .60)));
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#fffdf4";
    ctx.fillRect(0,0,W,H);

    {
      ctx.strokeStyle="rgba(85,96,168,.10)";
      ctx.lineWidth=1;
      for (let x=LEFT+30; x<RIGHT; x+=30) {
        ctx.beginPath(); ctx.moveTo(x,DANGER_Y); ctx.lineTo(x,FLOOR); ctx.stroke();
      }
      for (let y=DANGER_Y+30; y<FLOOR; y+=30) {
        ctx.beginPath(); ctx.moveTo(LEFT,y); ctx.lineTo(RIGHT,y); ctx.stroke();
      }
      ctx.fillStyle="#ffe1ef";
      ctx.beginPath(); ctx.arc(RIGHT-60,DANGER_Y+40,30,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(RIGHT-28,DANGER_Y+50,23,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(RIGHT-74,DANGER_Y+58,20,0,Math.PI*2); ctx.fill();
    }

    ctx.strokeStyle="#1e2350";
    ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(LEFT,FLOOR+8); ctx.lineTo(LEFT,DANGER_Y-18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(RIGHT,FLOOR+8); ctx.lineTo(RIGHT,DANGER_Y-18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(LEFT,FLOOR+6); ctx.lineTo(RIGHT,FLOOR+6); ctx.stroke();

    ctx.strokeStyle="#ff5f7a";
    ctx.setLineDash([10,8]); ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(LEFT,DANGER_Y); ctx.lineTo(RIGHT,DANGER_Y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="#d81159";
    ctx.font="900 11px system-ui,sans-serif";
    ctx.fillText("危险线",LEFT+5,DANGER_Y-8);

    if (state.running && state.canDrop) drawGuide();
    for (const b of state.balls) drawBallShape(b.x,b.y,b.r,TIERS[b.tier].color,TIERS[b.tier].label);

    for (const p of state.pops) drawSynthesisPop(p);
    drawCelebrations();
  }

  let last=performance.now();
  function frame(now) {
    const dt=Math.min(.033,(now-last)/1000); last=now;
    if (state.running) {
      state.elapsed += dt;
      // Two deterministic sub-steps reduce penetration and visible shaking.
      physics(dt/2);
      physics(dt/2);
      updateDanger(dt);
      updatePops(dt);
      updateCelebrations(dt);
    } else {
      updateCelebrations(dt);
    }
    draw();
    requestAnimationFrame(frame);
  }

  function pointerX(event) {
    const rect=canvas.getBoundingClientRect();
    return (event.clientX-rect.left)*(W/rect.width);
  }
  let aimingPointerId = null;
  canvas.addEventListener("pointerdown", event => {
    aimingPointerId = event.pointerId;
    state.aimX=pointerX(event);
    if (canvas.hasPointerCapture && !canvas.hasPointerCapture(event.pointerId)) {
      canvas.setPointerCapture(event.pointerId);
    }
    event.preventDefault();
  }, {passive:false});
  canvas.addEventListener("pointermove", event => {
    if (aimingPointerId !== null && event.pointerId !== aimingPointerId) return;
    state.aimX=pointerX(event);
    event.preventDefault();
  }, {passive:false});
  canvas.addEventListener("pointerup", event => {
    if (aimingPointerId === null || event.pointerId !== aimingPointerId) return;
    aimingPointerId = null;
    state.aimX=pointerX(event);
    drop();
    event.preventDefault();
  }, {passive:false});
  canvas.addEventListener("pointercancel", event => {
    if (event.pointerId === aimingPointerId) aimingPointerId = null;
  });
  loginForm.addEventListener("submit", handleLogin);
  leaderboardButton.addEventListener("click", showLeaderboard);
  boardClose.addEventListener("click", () => { boardOverlay.hidden = true; });
  boardOverlay.addEventListener("click", event => {
    if (event.target === boardOverlay) boardOverlay.hidden = true;
  });
  logoutButton.addEventListener("click", handleLogout);
  window.addEventListener("keydown", event => {
    if (!state.running || !loginOverlay.hidden) return;
    if (event.key === "ArrowLeft") { state.aimX -= 20; event.preventDefault(); }
    if (event.key === "ArrowRight") { state.aimX += 20; event.preventDefault(); }
    if (event.key === "ArrowDown" || event.key === " ") { drop(); event.preventDefault(); }
  });
  document.getElementById("restart").addEventListener("click", reset);
  document.getElementById("overlayRestart").addEventListener("click", reset);



  configureCanvasQuality();
  syncHud();
  restoreSession();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
